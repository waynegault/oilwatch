[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oilwatch"
version = "0.1.0"
description = "Domestic heating oil supplier discovery, quote tracking, analytics, and MCP tools."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Wayne and Codex" }
]
dependencies = [
  "apscheduler>=3.10,<4",
  "beautifulsoup4>=4.12",
  "fastmcp>=3.1,<4",
  "geopy>=2.4",
  "httpx>=0.28",
  "matplotlib>=3.10",
  "msal>=1.30",
  "playwright>=1.40",
  "selenium>=4.20",
  "undetected-chromedriver>=3.5",
  "xlrd>=2.0",
  "setuptools>=68"
]

[project.scripts]
oilwatch = "oilwatch.cli:main"
oilwatch-mcp = "oilwatch.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["oilwatch"]

[project.optional-dependencies]
dev = ["coverage>=7"]

[tool.coverage.run]
source = ["oilwatch"]
branch = true

[tool.coverage.report]
show_missing = true
# Measured at 95.45pc. The floor is the largest whole point that leaves a
# comfortable margin below the measurement: rounding up to 95 would leave under
# half a point, which a Python or platform difference can move, so it would cry
# wolf instead of catching a slide. A slide of a point still fails.
fail_under = 94
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

