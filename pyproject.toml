[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oilwatch"
version = "0.1.0"
description = "Domestic heating oil supplier discovery, quote tracking, analytics, and MCP tools."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Wayne and Codex" }
]
dependencies = [
  "apscheduler>=3.10,<4",
  "beautifulsoup4>=4.12",
  "fastmcp>=3.1,<4",
  "geopy>=2.4",
  "httpx>=0.28",
  "matplotlib>=3.10",
  "msal>=1.30",
  "playwright>=1.40",
  "selenium>=4.20",
  "undetected-chromedriver>=3.5",
  "xlrd>=2.0",
  "setuptools>=68"
]

[project.scripts]
oilwatch = "oilwatch.cli:main"
oilwatch-mcp = "oilwatch.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["oilwatch"]

[project.optional-dependencies]
dev = ["coverage>=7", "ruff>=0.16", "pyright>=1.1"]

[tool.coverage.run]
source = ["oilwatch"]
branch = true

[tool.coverage.report]
show_missing = true
# Measured at 95.52pc. The floor is the largest whole point that leaves a
# comfortable margin below the measurement: rounding up to 95 would leave under
# half a point, which a Python or platform difference can move, so it would cry
# wolf instead of catching a slide. A slide of a point still fails.
fail_under = 94
# A line ending in an ellipsis is a declaration, not behaviour: every one of them
# in this package is a Protocol member (oilwatch/connectors/protocols.py,
# oilwatch/geo.py, oilwatch/discovery.py), whose contract is checked by pyright
# rather than by running it. Counting their bodies measures nothing, and their
# entry branches can never be taken, which showed up as thirty-odd partial
# branches and a growing drag on this figure every time a protocol was added.
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", '\.\.\.\s*$']

[tool.ruff]
target-version = "py312"
# Not a formatting standard. E501 is deliberately not selected — 666 lines in this
# repo exceed 88 and the longest is 198 (a long string in notify.py) — so this only
# governs when I001 wraps an import.
line-length = 100

[tool.ruff.lint]
# Pinned explicitly rather than inherited. Ruff's defaults widened between
# releases (0.16 reports I001/SIM/UP/RUF/PYI/DTZ without being asked), so "clean"
# changed meaning under us. A rule is listed because a failure is worth acting on,
# and left out with the reason written down.
select = [
  "E4", "E7", "E9",       # pycodestyle errors, excluding E501
  "F",                    # pyflakes — F821 is what found the sign-in NameError
  "I", "UP",              # import sorting, pyupgrade
  "B", "BLE",             # bugbear; BLE001 is this codebase's own noqa convention
  "C4", "SIM", "FURB",
  "RUF010", "RUF012",     # explicit conversions, mutable class defaults
  "S110",                 # try/except/pass — the one bandit rule worth acting on
  "PLE0604", "PLW1510",
]
ignore = [
  # Naive datetimes are the design: one household, naive times throughout
  # (see models.utcnow_naive), stored as naive text. tz-aware is the exception.
  "DTZ",
  # PYI* targets stub files; these modules are implementation.
  "PYI",
  # An unused suppression is section 8.4's business, not a lint rule's.
  "RUF100",
]
# Deliberately absent: W (its W293 fires 105 times, most of them inside the
# call-sheet string literals in telephone.py, where --fix would silently rewrite
# the document those strings emit); E501; the PLR* complexity thresholds; and
# S101/PLC0415 (assert is idiomatic in tests, and Playwright/Selenium must stay
# lazily imported — see connectors/suppliers/__init__.py).

